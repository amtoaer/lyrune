[workspace]
members = ["crates/lyrune-app", "crates/qqmusic-api"]
default-members = ["crates/lyrune-app"]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
aes = "0.8"
anyhow = "1.0"
async-channel = "2.5"
async-tungstenite = { version = "0.29", default-features = false, features = [
    "tokio-runtime",
    "tokio-rustls-native-certs",
] }
base64 = "0.22"
bytes = "1"
cookie = "0.18.1"
directories = "6.0"
dotenvy = "0.15"
ecb = { version = "0.1", features = ["alloc"] }
flate2 = "1"
futures-util = "0.3"
# Keep the Zed source URL unqualified so Cargo unifies it with gpui-component's
# transitive dependencies. The patch below redirects both to our GPUI fork.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "56f3d903eaef3b2504cf31518ed1ad69d80166ff" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "56f3d903eaef3b2504cf31518ed1ad69d80166ff" }
gpui-platform = { package = "gpui_platform", git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring = "4.1.6"
ksni = { version = "0.3.6", features = ["blocking"] }
md5 = "0.8"
mpris-server = { version = "0.10.0", default-features = false, features = ["tokio"] }
qrcode = "0.14.1"
quick-xml = "0.41"
qqmusic-api = { package = "netease-qq-music-api", path = "crates/qqmusic-api" }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
    "brotli",
    "form",
    "gzip",
    "json",
    "query",
    "rustls-no-provider",
    "stream",
    "zstd",
] }
resvg = "0.46"
rodio = "0.22.2"
rumqttc = { version = "0.25.1", default-features = false }
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha1 = "0.10"
stream-download = { version = "0.24.3", default-features = false }
thiserror = "2"
time = "0.3.47"
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tray-icon = { version = "0.24.2", default-features = false }
uuid = { version = "1.18", features = ["v4"] }
wana_kana = { version = "5.0", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/amtoaer/zed", rev = "ce62fe124dc4d4cef2b33c9114f982090376b866", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/amtoaer/zed", rev = "ce62fe124dc4d4cef2b33c9114f982090376b866" }
gpui_platform = { git = "https://github.com/amtoaer/zed", rev = "ce62fe124dc4d4cef2b33c9114f982090376b866" }

[workspace]
members = ["crates/lyrune-app", "crates/qqmusic-api"]
default-members = ["crates/lyrune-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
aes = "0.8"
anyhow = "1.0"
async-channel = "2.5"
async-tungstenite = { version = "0.29", default-features = false, features = [
    "tokio-runtime",
    "tokio-rustls-native-certs",
] }
base64 = "0.22"
bytes = "1"
cookie = "0.18.1"
directories = "6.0"
dotenvy = "0.15"
ecb = { version = "0.1", features = ["alloc"] }
futures-util = "0.3"
# Keep the Zed source URL unqualified so Cargo unifies it with gpui-component's
# transitive dependencies. Cargo.lock pins every Zed crate to 24e25552.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "56f3d903eaef3b2504cf31518ed1ad69d80166ff" }
gpui-platform = { package = "gpui_platform", git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4.1.6"
md5 = "0.8"
qrcode = "0.14.1"
qqmusic-api = { package = "netease-qq-music-api", path = "crates/qqmusic-api" }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
    "brotli",
    "form",
    "gzip",
    "json",
    "query",
    "rustls-no-provider",
    "stream",
    "zstd",
] }
rodio = "0.22.2"
rumqttc = { version = "0.25.1", default-features = false }
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
stream-download = { version = "0.24.3", default-features = false }
thiserror = "2"
time = "0.3.47"
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
uuid = { version = "1.18", features = ["v4"] }
